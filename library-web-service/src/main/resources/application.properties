# ---------------------------------------------------------------------------
# The REST service - the middle tier. Runs on port 8080.
#
# Before you run it, the database and the user must already exist:
#
#   CREATE DATABASE spring_db;
#   CREATE USER 'spring_user'@'localhost' IDENTIFIED BY '1234abcd';
#   GRANT ALL PRIVILEGES ON spring_db.* TO 'spring_user'@'localhost';
#   FLUSH PRIVILEGES;
# ---------------------------------------------------------------------------
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/spring_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=spring_user
spring.datasource.password=1234abcd
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=true

# Hibernate must NOT create the tables. schema.sql does that - and it lives in
# the library-domain-model module, because that module owns the database.
spring.jpa.hibernate.ddl-auto=none
spring.datasource.initialization-mode=always

# A field maps to a column with the same name: addedDate -> addedDate.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# The controllers hand back DTOs, and a DTO is a finished, detached object by
# the time it is written out. Nothing lazy is read during rendering, so this can
# be switched off - one more thing the DTO pattern buys you.
spring.jpa.open-in-view=false
